name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The repository carries `bun.lock` and no `package-lock.json`: Cloudflare's
      # build image installs with Bun, so CI has to agree with it.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      # `src/client/routeTree.gen.ts` is generated by the Vite plugin and is not in
      # the repository, so a clean checkout cannot typecheck until it is built. The
      # build is also the real gate: the Worker and the SPA ship as one artifact.
      - run: bun run build

      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test
