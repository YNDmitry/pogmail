name: Update

# Dispatched from Administration → Overview in a running instance. Merges the
# upstream default branch into this installation and applies D1 migrations.
# It deliberately does not deploy: you decide when new code goes live.
on:
  workflow_dispatch:
    inputs:
      upstream:
        description: Upstream repository to merge from
        required: false
        default: https://github.com/YNDmitry/pogmail.git

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Merge upstream
        run: |
          git config user.name "pogmail-update"
          git config user.email "noreply@users.noreply.github.com"
          git remote add upstream "${{ inputs.upstream }}" || git remote set-url upstream "${{ inputs.upstream }}"
          git fetch upstream
          git merge --no-edit "upstream/$(git remote show upstream | sed -n 's/.*HEAD branch: //p')"
          git push

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci --foreground-scripts

      - name: Apply migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply DB --remote
