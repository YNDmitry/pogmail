name: Update

# Dispatched from Administration → Overview in a running instance, or run by hand
# from the Actions tab — which is the way in when the instance itself is broken
# enough that you cannot sign in. Merges the upstream default branch into this
# installation and applies D1 migrations.
#
# It runs no deploy step of its own, but an installation created by the Deploy to
# Cloudflare button has Workers Builds watching this repository, so the push this
# job makes is what ships the new code.
on:
  workflow_dispatch:
    inputs:
      upstream:
        description: Upstream repository to merge from
        required: false
        default: https://github.com/YNDmitry/pogmail.git

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Merge upstream
        run: |
          git config user.name "pogmail-update"
          git config user.email "noreply@users.noreply.github.com"
          git remote add upstream "${{ inputs.upstream }}" || git remote set-url upstream "${{ inputs.upstream }}"
          git fetch upstream
          git merge --no-edit "upstream/$(git remote show upstream | sed -n 's/.*HEAD branch: //p')"
          git push

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Apply migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun x wrangler d1 migrations apply DB --remote
