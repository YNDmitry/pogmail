name: Update

# Dispatched from Administration → Overview in a running instance, or run by hand
# from the Actions tab — which is the way in when the instance itself is broken
# enough that you cannot sign in.
#
# It only merges the upstream default branch into this installation. It needs no
# secrets: pushing uses the token GitHub gives the job, Workers Builds deploys the
# push, and pending D1 migrations are applied by the Worker itself from
# Administration → Overview. Nothing here holds a Cloudflare credential.
on:
  workflow_dispatch:
    inputs:
      upstream:
        description: Upstream repository to merge from
        required: false
        default: https://github.com/YNDmitry/pogmail.git

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Merge upstream
        run: |
          git config user.name "pogmail-update"
          git config user.email "noreply@users.noreply.github.com"
          git remote add upstream "${{ inputs.upstream }}" || git remote set-url upstream "${{ inputs.upstream }}"
          git fetch upstream
          git merge --no-edit "upstream/$(git remote show upstream | sed -n 's/.*HEAD branch: //p')"
          git push

      - name: Next step
        run: |
          {
            echo "### Merged"
            echo
            echo "Workers Builds will deploy this push. If the new code brings schema"
            echo "changes, open Administration -> Overview afterwards and apply the"
            echo "pending migrations from there."
          } >> "$GITHUB_STEP_SUMMARY"
