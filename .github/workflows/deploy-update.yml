name: Update

# Dispatched from Administration → Overview in a running instance, or run by hand
# from the Actions tab — which is the way in when the instance itself is broken
# enough that you cannot sign in. Merges the upstream default branch into this
# installation and applies D1 migrations.
#
# It runs no deploy step of its own, but an installation created by the Deploy to
# Cloudflare button has Workers Builds watching this repository, so the push this
# job makes is what ships the new code.
on:
  workflow_dispatch:
    inputs:
      upstream:
        description: Upstream repository to merge from
        required: false
        default: https://github.com/YNDmitry/pogmail.git

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Job-level, because a step's `if` reads the env context but not the step's own
    # `env:` block — and `secrets` is not a context `if` can read at all.
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Merge upstream
        run: |
          git config user.name "pogmail-update"
          git config user.email "noreply@users.noreply.github.com"
          git remote add upstream "${{ inputs.upstream }}" || git remote set-url upstream "${{ inputs.upstream }}"
          git fetch upstream
          git merge --no-edit "upstream/$(git remote show upstream | sed -n 's/.*HEAD branch: //p')"
          git push

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      # The merge above is the update; migrations need credentials this repository
      # may not have been given. A missing token is reported rather than failing the
      # run, because the code has already been pushed by then.
      - name: Apply migrations
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: bun x wrangler d1 migrations apply DB --remote

      - name: Report skipped migrations
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: |
          {
            echo "### Migrations were not applied"
            echo
            echo "This repository has no CLOUDFLARE_API_TOKEN secret, so pending D1"
            echo "migrations were skipped. Upstream was merged and Workers Builds will"
            echo "deploy the new code, which may expect a schema that is not there yet."
            echo
            echo "Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID under Settings ->"
            echo "Secrets and variables -> Actions, then run this workflow again, or"
            echo "apply them yourself with: bun x wrangler d1 migrations apply DB --remote"
          } >> "$GITHUB_STEP_SUMMARY"
